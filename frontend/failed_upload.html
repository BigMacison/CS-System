<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Server Upload</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 24px;
      color: #aaa;
      margin-top: 0;
      margin-bottom: 30px;
      font-weight: normal;
    }
    .button-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    button {
      padding: 15px 30px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      transition: opacity 0.2s;
    }
    /* Upload Button (Blau) */
    #uploadBtn {
      background-color: #0066cc;
    }
    /* Stop Button (Rot) */
    #stopBtn {
      background-color: #cc0000;
      display: none; /* Standardmäßig ausblenden */
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Hilfsklasse zum Ausblenden */
    .hidden {
      display: none !important;
    }
    #progressContainer {
      width: 300px;
      height: 20px;
      background-color: #222;
      border-radius: 4px;
      overflow: hidden;
      display: none;
      margin-top: 10px;
    }
    #progressBar {
      height: 100%;
      background-color: #228833;
      width: 0%;
      transition: width 0.3s ease;
    }
    #errorMessage {
      color: #cc0000;
      font-size: 18px;
      margin-top: 20px;
    }
    #statusMessage {
      color: #aaa;
      margin-bottom: 15px;
      height: 20px;
    }
  </style>
</head>
<body>
  <h1 id="mainTitle">Server wasn't uploaded</h1>
  <h2 id="subTitle">Please upload manually</h2>

  <div class="button-container">
    <button id="stopBtn">Stop & Upload</button>
    <button id="uploadBtn">Upload</button>
  </div>

  <div id="statusMessage"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>
  <div id="errorMessage"></div>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const stopBtn = document.getElementById("stopBtn");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const errorMessage = document.getElementById("errorMessage");
    const statusMessage = document.getElementById("statusMessage");
    const mainTitle = document.getElementById("mainTitle");
    const subTitle = document.getElementById("subTitle");
    let ws;

    // Prüft beim Laden, ob der Container noch läuft
    async function checkContainerStatus() {
      try {
        const res = await fetch("/server/is_container_running", {
          method: "POST"
        });
        if (!res.ok) throw new Error("Could not check container status");
        
        const data = await res.json();
        
        if (data.running === true) {
          // Container läuft: Stop Button zeigen, Upload disablen
          stopBtn.style.display = "inline-block";
          uploadBtn.disabled = true;
          uploadBtn.title = "Please stop the container first";
          mainTitle.textContent = "Container still running";
          subTitle.textContent = "Stop container to sync data";
        } else {
          // Container läuft nicht: Stop Button weg, Upload normal
          stopBtn.style.display = "none";
          uploadBtn.disabled = false;
          mainTitle.textContent = "Server wasn't uploaded";
          subTitle.textContent = "Please upload manually";
        }
      } catch (err) {
        console.error("Status check error:", err);
        errorMessage.textContent = "Error checking status: " + err.message;
      }
    }

    function initializeWebSocket() {
      ws = new WebSocket(`ws://${window.location.host}/ws`);

      ws.onopen = () => {
        console.log("WebSocket connected for upload progress");
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          // Infos verarbeiten
          if (data.info === "server_stopped") {
            statusMessage.textContent = "Container stopped. Starting upload...";
            // Hier könnte man theoretisch UI updates machen, 
            // aber der Upload progress kommt ja über 'restic' rein.
          }
          
          // Restic Progress verarbeiten
          if (data.restic && data.restic.message_type === "status") {
            // Wenn Progress kommt, sicherstellen, dass die Leere sichtbar ist
            progressContainer.style.display = "block";
            const percent = Math.round(data.restic.percent_done * 100);
            progressBar.style.width = percent + "%";
            statusMessage.textContent = `Uploading: ${percent}%`;
          } else if (data.restic && data.restic.message_type === "summary") {
            statusMessage.textContent = "Upload finished. Reloading...";
            setTimeout(() => window.location.reload(), 1000);
          }
        } catch (err) {
          console.error("Error parsing WebSocket message:", err);
        }
      };

      ws.onclose = () => {
        console.log("WebSocket closed");
      };

      ws.onerror = (err) => {
        console.error("WebSocket error:", err);
      };
    }

    // Logik für den normalen Upload Button
    uploadBtn.addEventListener("click", async () => {
      uploadBtn.disabled = true;
      stopBtn.disabled = true; // Auch den anderen Button sperren
      progressContainer.style.display = "block";
      errorMessage.textContent = "";
      statusMessage.textContent = "Starting upload...";
      
      try {
        const res = await fetch("/server/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        if (!res.ok) throw new Error(`Status ${res.status}`);
        const data = await res.json();
        if (data.status !== "server_uploaded") {
          throw new Error(`Unexpected response: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        console.error("Error uploading server:", err);
        errorMessage.textContent = `Error: ${err.message}`;
        // Buttons wieder freigeben (Status checken um zu wissen welcher)
        checkContainerStatus(); 
        progressContainer.style.display = "none";
        progressBar.style.width = "0%";
      }
    });

    // Logik für den Stop & Upload Button
    stopBtn.addEventListener("click", async () => {
      stopBtn.disabled = true;
      uploadBtn.disabled = true;
      progressContainer.style.display = "block"; // Leiste schon mal anzeigen (noch 0%)
      errorMessage.textContent = "";
      statusMessage.textContent = "Stopping container...";

      try {
        const res = await fetch("/server/container_cleanup_stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        
        if (!res.ok) throw new Error(`Status ${res.status}`);
        // Backend triggert jetzt Stop -> WebSocket -> Upload -> WebSocket
        
      } catch (err) {
        console.error("Error stopping container:", err);
        errorMessage.textContent = `Error: ${err.message}`;
        stopBtn.disabled = false;
        progressContainer.style.display = "none";
      }
    });

    // Initialisierung
    initializeWebSocket();
    checkContainerStatus();
  </script>
</body>
</html>
